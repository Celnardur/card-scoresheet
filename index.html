<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Scoresheet</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Georgia", "Times New Roman", serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        background: #f7f1e8;
        color: #1f1b16;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }

      header {
        margin-bottom: 32px;
      }

      h1 {
        font-size: 2.5rem;
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 16px;
      }

      .nav-card {
        border: 2px solid #1f1b16;
        border-radius: 12px;
        padding: 20px;
        background: #fffaf2;
      }

      .nav-card h2 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      .primary-button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        border: 2px solid #1f1b16;
        background: #f2c94c;
        color: #1f1b16;
        text-decoration: none;
        font-weight: 600;
      }

      .primary-button:hover,
      .primary-button:focus {
        background: #f8d66a;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Card Scoresheet</h1>
        <p>
          Keep track of scores, deals, bids, and round stats for your favorite
          card games. Everything runs locally in your browser.
        </p>
      </header>

      <section class="nav-card">
        <h2>Gin Rummy</h2>
        <p>Track hands, scores, and round progress for Gin Rummy.</p>
        <a class="primary-button" href="gin-rummy/index.html">Open Gin Rummy</a>
      </section>
    </main>
  </body>
</html>
